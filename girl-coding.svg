<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Animated girl coding on a laptop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .float1 { animation: float 3s ease-in-out infinite alternate; }
    .float2 { animation: float 3.6s ease-in-out infinite alternate-reverse; }
    .float3 { animation: float 2.8s ease-in-out infinite alternate; animation-delay: .6s; }
    @keyframes float { from { transform: translateY(0); opacity: .55; } to { transform: translateY(-10px); opacity: 1; } }

    .sway { transform-origin: 200px 90px; animation: sway 4s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }

    .bob { animation: bob 1.1s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2px); } }

    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

    .glow { animation: glow 2s ease-in-out infinite alternate; }
    @keyframes glow { from { opacity: .35; } to { opacity: 1; } }

    .steam { stroke-dasharray: 10 8; animation: steam 2s linear infinite; }
    @keyframes steam { from { stroke-dashoffset: 0; opacity: .8; } to { stroke-dashoffset: -36; opacity: .1; } }

    .twinkle { animation: twinkle 2.4s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

    .tagline { animation: fade 3s ease-in-out infinite alternate; }
    @keyframes fade { from { opacity: .5; } to { opacity: 1; } }

    text { font-family: 'Fira Code', 'Courier New', monospace; font-weight: 700; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="396" height="296" rx="20" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- Twinkling stars -->
  <circle class="twinkle" cx="45" cy="45" r="2" fill="#72d9d9"/>
  <circle class="twinkle" cx="350" cy="60" r="2.4" fill="#1f6feb" style="animation-delay:.8s"/>
  <circle class="twinkle" cx="70" cy="140" r="1.8" fill="#ffffff" style="animation-delay:1.4s"/>
  <circle class="twinkle" cx="335" cy="150" r="1.8" fill="#72d9d9" style="animation-delay:.4s"/>

  <!-- Floating code bubbles -->
  <g class="float1"><text x="60" y="95" font-size="22" fill="#72d9d9">&lt;/&gt;</text></g>
  <g class="float2"><text x="300" y="100" font-size="22" fill="#1f6feb">{ }</text></g>
  <g class="float3"><text x="95" y="190" font-size="18" fill="#f7df1e">JS</text></g>
  <g class="float1" style="animation-delay:1s"><text x="285" y="185" font-size="18" fill="#3178c6">TS</text></g>

  <!-- Desk -->
  <rect x="20" y="238" width="360" height="12" rx="6" fill="#30363d"/>

  <!-- Girl -->
  <g class="bob">
    <!-- long hair back -->
    <g class="sway">
      <path d="M160 118 C160 78 240 78 240 118 L246 182 C236 190 224 186 220 176 L180 176 C176 186 164 190 154 182 Z" fill="#3b2a20"/>
    </g>

    <!-- shoulders / hoodie -->
    <path d="M132 238 C132 196 158 172 200 172 C242 172 268 196 268 238 Z" fill="#72d9d9"/>
    <!-- hoodie strings -->
    <path d="M190 176 L188 200 M210 176 L212 200" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- arms -->
    <path d="M146 196 Q126 222 134 238" stroke="#5cc4c4" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M254 196 Q274 222 266 238" stroke="#5cc4c4" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- neck & head -->
    <rect x="192" y="146" width="16" height="30" rx="6" fill="#f0bd98"/>
    <circle cx="200" cy="122" r="33" fill="#f6cfae"/>

    <!-- bangs -->
    <path d="M166 122 C164 88 236 88 234 122 C224 108 208 104 194 108 C182 111 172 116 166 122 Z" fill="#3b2a20"/>

    <!-- face -->
    <ellipse class="eye" cx="187" cy="127" rx="3.2" ry="4.4" fill="#1f1f1f"/>
    <ellipse class="eye" cx="213" cy="127" rx="3.2" ry="4.4" fill="#1f1f1f"/>
    <circle cx="178" cy="138" r="5" fill="#ff8fa3" opacity=".5"/>
    <circle cx="222" cy="138" r="5" fill="#ff8fa3" opacity=".5"/>
    <path d="M192 138 Q200 146 208 138" stroke="#a0522d" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- headphones -->
    <path d="M164 122 C164 80 236 80 236 122" stroke="#1f6feb" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="158" y="114" width="12" height="24" rx="5" fill="#1f6feb"/>
    <rect x="230" y="114" width="12" height="24" rx="5" fill="#1f6feb"/>
  </g>

  <!-- Laptop (back view) -->
  <rect x="136" y="196" width="128" height="42" rx="5" fill="#8b949e"/>
  <rect x="136" y="196" width="128" height="6" rx="3" fill="#6e7681"/>
  <circle class="glow" cx="200" cy="218" r="8" fill="#72d9d9"/>
  <circle cx="200" cy="218" r="3.5" fill="#0d1117"/>
  <rect x="124" y="236" width="152" height="5" rx="2.5" fill="#6e7681"/>

  <!-- Coffee mug -->
  <rect x="305" y="214" width="24" height="24" rx="5" fill="#f0f6fc"/>
  <path d="M329 220 Q340 224 329 232" stroke="#f0f6fc" stroke-width="3" fill="none"/>
  <rect x="305" y="214" width="24" height="6" rx="3" fill="#72d9d9"/>
  <path class="steam" d="M312 208 Q308 198 313 190" stroke="#8b949e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path class="steam" d="M322 208 Q318 198 323 190" stroke="#8b949e" stroke-width="2.5" fill="none" stroke-linecap="round" style="animation-delay:.9s"/>

  <!-- Tagline -->
  <text class="tagline" x="200" y="279" font-size="14" fill="#72d9d9" text-anchor="middle">Code. Create. Repeat.</text>
</svg>
